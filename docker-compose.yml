# No .env file is used. All values below, including passwords, are substituted from real environment
# variables that must already be exported in your shell/CI/systemd unit before running `docker compose up`
# (e.g. `export IMAP_HOST=imap.example.com IMAP_PASSWORD=the-password`).

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-llama3.1:8b}"]
    restart: "no"

  autoarchive:
    build:
      context: .
      dockerfile: src/AutoArchive.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - ${NEXTCLOUD_ARCHIVE_HOST_PATH}:/archive
      - autoarchive-data:/data
    environment:
      - IMAP__HOST=${IMAP_HOST}
      - IMAP__USERNAME=${IMAP_USERNAME}
      - IMAP__PASSWORD=${IMAP_PASSWORD}
      - SMTP__HOST=${SMTP_HOST}
      - SMTP__USERNAME=${SMTP_USERNAME}
      - SMTP__PASSWORD=${SMTP_PASSWORD}
      - SMTP__FROMADDRESS=${SMTP_FROM_ADDRESS}
      - NOTIFICATIONS__RECIPIENTEMAIL=${NOTIFICATIONS_RECIPIENT_EMAIL}
      - ARCHIVE__ROOTPATH=/archive
      - STORAGE__DATABASEPATH=/data/autoarchive.db
      - OLLAMA__BASEURL=http://ollama:11434
      - OLLAMA__MODEL=${OLLAMA_MODEL:-llama3.1:8b}

volumes:
  ollama-models:
  autoarchive-data:
